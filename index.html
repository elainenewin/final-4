<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CubeFlow</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="container">

    <!-- Header -->
    <header>
      <div class="logo">
        <div class="cube-icon">
          <div class="face top"></div>
          <div class="face left"></div>
          <div class="face right"></div>
        </div>
        <span class="logo-text">Cube<span class="accent">Flow</span></span>
      </div>
      <div class="session-badge">SESSION ACTIVE</div>
    </header>

    <!-- Scramble Section -->
    <section class="scramble-section">
      <div class="section-label">SCRAMBLE</div>
      <div class="scramble-display" id="scramble">R U R' F2 L D B' U2 R' L</div>
      <button class="new-scramble-btn" id="newScrambleBtn" title="Generate new scramble">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
        New Scramble
      </button>
    </section>

    <!-- Timer Section -->
    <section class="timer-section">
      <div class="timer-ring">
        <div class="timer-display" id="timerDisplay">0.00</div>
      </div>
      <div class="timer-status" id="timerStatus">HOLD SPACE TO START</div>
      <div class="timer-hint" id="timerHint">Release to begin timing</div>
    </section>

    <!-- Stats Section -->
    <section class="stats-section">
      <div class="stat-card">
        <div class="stat-label">BEST</div>
        <div class="stat-value" id="bestTime">--</div>
      </div>
      <div class="stat-card accent-card">
        <div class="stat-label">LAST</div>
        <div class="stat-value" id="lastTime">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">AVERAGE</div>
        <div class="stat-value" id="avgTime">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">SOLVES</div>
        <div class="stat-value" id="solveCount">0</div>
      </div>
    </section>

    <!-- History Section -->
    <section class="history-section">
      <div class="section-label">RECENT SOLVES</div>
      <div class="history-list" id="historyList">
        <div class="history-empty">No solves yet. Press Space to start!</div>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
